[package]
name = "block-client-rs"
authors = ["Aurora Labs <hello@aurora.dev>"]
version = "0.1.5"
edition = "2024"
readme = "README.md"
repository = "https://github.com/aurora-is-near/block-client-rs.git"
description = "Client for the block API service"
keywords = ["block", "client", "api", "service", "grpc"]
publish = false
license = "CC0-1"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.14", features = ["channel"] }
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"
walkdir = "2"

[features]

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

missing_errors_doc = "allow"
